  <line x1="24" y1="12" x2="12" y2="34" stroke="#14b8a6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="12" x2="36" y2="34" stroke="#14b8a6" stroke-width="2.5" stroke-linecap="round"/>
